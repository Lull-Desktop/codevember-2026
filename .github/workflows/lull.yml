name: Lull scene checks

on:
  push:
    paths:
      - "tools/lull/**"
      - "scripts/lull/**"
      - "*/lull/**"
      - "docs/lull-scenes.md"
      - ".github/workflows/lull.yml"
  pull_request:
    paths:
      - "tools/lull/**"
      - "scripts/lull/**"
      - "*/lull/**"
      - "docs/lull-scenes.md"
      - ".github/workflows/lull.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run lull:test
      - run: npm run lull:check