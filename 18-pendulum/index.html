<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pendulum</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #bdc8d4;
      }
      canvas {
        display: block;
      }
      /* the ball's sizes, to switch between as it runs (src/veil.ts; the links also open on their own) */
      .balls {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(40, 48, 60, 0.32);
        backdrop-filter: blur(6px);
        font: 500 13px/1 system-ui, -apple-system, sans-serif;
        letter-spacing: 0.02em;
      }
      .balls a {
        padding: 7px 14px;
        border-radius: 999px;
        color: #f4f6fa;
        text-decoration: none;
        opacity: 0.8;
      }
      .balls a:hover {
        opacity: 1;
      }
      .balls a[aria-current="page"] {
        background: rgba(244, 246, 250, 0.92);
        color: #8a4a36;
        opacity: 1;
      }
      /* narrow: below the counter and the panel's bar, which meet it in the corners */
      @media (max-width: 780px) {
        .balls {
          top: 60px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="balls" aria-label="the ball's size">
      <a href="./">ball</a><a href="./?ball=0.26">big</a><a href="./?ball=0.38">bigger</a><a href="./?ball=0.52">huge</a>
    </nav>
    <script type="module" src="./src/veil.ts"></script>
  </body>
</html>
